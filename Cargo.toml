[package]
name = "dunnage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Shrink Cargo target directories without slowing builds"
publish = false

# The binary is a front end; the library builds without its dependencies, so a build system
# can embed it (`cargo check --lib --no-default-features`).
[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:indicatif"]

[[bin]]
name = "dunnage"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
walkdir = "2.5.0"

# `FICLONE` and `FS_IOC_SETFLAGS` without hand-written `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.3", features = ["fs"] }

# Transparent compression is an APFS feature, and so is the crate that drives it.
[target.'cfg(target_os = "macos")'.dependencies]
applesauce = "0.8.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
trycmd = "1.2.1"
