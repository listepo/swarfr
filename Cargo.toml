[package]
name = "swarfr"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Shrink Cargo target directories without slowing builds"
publish = false
# cargo-dist hosts releases on this repository; the Homebrew formula links the homepage (T43).
repository = "https://github.com/listepo/swarfr"
homepage = "https://github.com/listepo/swarfr"

# The binary is a front end; the library builds without its dependencies, so a build system
# can embed it (`cargo check --lib --no-default-features`).
[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[[bin]]
name = "swarfr"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
walkdir = "2.5.0"

# `FICLONE` / `FS_IOC_SETFLAGS` on Linux and `fclonefileat` on macOS, without hand-written `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs"] }

# Transparent compression is an APFS feature, and so is the crate that drives it.
[target.'cfg(target_os = "macos")'.dependencies]
applesauce = "0.8.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
trycmd = "1.2.1"

# `publish = false` hides the binary from cargo-dist; this puts it back (T43).
[package.metadata.dist]
dist = true

# The profile cargo-dist builds release archives with (T43): `dev`, so every
# release is a dev build (unoptimized, debug info, no LTO).
[profile.dist]
inherits = "dev"
