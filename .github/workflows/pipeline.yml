# Security scans from the shared pyrlyn/ci pipeline: CodeQL, Semgrep and Snyk in parallel
# behind `pipeline / gate`. Rust CI is not repeated here (`rust: false`): ci.yml runs it on the
# same pushes and pull requests through pyrlyn/ci ci-rust.yml. Draft pull requests skip every job,
# the gate included, until marked ready. Secrets are passed explicitly.
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: pyrlyn/ci/.github/workflows/pipeline.yml@c875cd763ad0c4abbd936e480be5752330d3b66b # main 2026-10-07
    permissions:
      contents: read
      security-events: write
      actions: write # cancel-run on failure, required by pyrlyn/ci pipeline.yml
    with:
      rust: false
      codeql-languages: '["actions", "rust"]'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
