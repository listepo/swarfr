# T43. release-plz keeps a "release: vX.Y.Z" pull request open on main with the next version and
# the changelog, through the shared pyrlyn/ci release-plz.yml. It never releases: merging the
# release PR tags nothing and dispatches nothing. The release itself is Actions -> Bump and
# release (bump.yml), which releases the version in Cargo.toml when it is not tagged yet, so
# after merging a release PR run Bump and release to ship it (docs/release.md).
#
# The shared workflow holds the PR back while the current version has no tag (a release in
# flight). release-plz.toml keeps git_tag_enable and git_release_enable off: dist creates the tag
# and the GitHub Release.
#
# RELEASE_PLZ_TOKEN (a fine-grained PAT: contents + pull requests, write) is required, not
# optional: GitHub starts no workflow from a GITHUB_TOKEN event, so a pull request opened with the
# default token would be merged having never run ci.yml.
# Inputs, secrets and permissions: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: pyrlyn/ci/.github/workflows/release-plz.yml@c875cd763ad0c4abbd936e480be5752330d3b66b # main 2026-10-07
    permissions:
      contents: write # the release branch
      pull-requests: write # the release PR
      actions: write # cancel-run on failure
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      package: swarfr
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
