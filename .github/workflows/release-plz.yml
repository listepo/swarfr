# T43. A second way in: release-plz keeps a "release: vX.Y.Z" pull request open on main with the
# next version and the changelog; merging it runs verify (`just check` and the cross check, on
# Linux and macOS) on the merge commit and then dispatches the dist Release workflow
# (release.yml, `tag=vX.Y.Z`), the same dispatch as scripts/release.sh. The flow lives in
# listepo/infra (release-plz.yml).
#
# release-plz creates neither the tag nor the GitHub Release — dist does both from release.yml —
# and reads the tag dist pushes to learn that a version is out (`git_only` in release-plz.toml).
#
# RELEASE_PLZ_TOKEN (a fine-grained PAT: contents + pull requests, write) is required, not
# optional: GitHub starts no workflow from a GITHUB_TOKEN event, so a pull request opened with the
# default token would be merged having never run ci.yml.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: listepo/infra/.github/workflows/release-plz.yml@189816ac5a375e18e0235044970efcbc40e3cabd
    permissions:
      contents: write # the release branch
      pull-requests: write # the release PR
      actions: write # dispatch release.yml after the merge
    with:
      package: swarfr
      # Not on crates.io (R7); the release goes straight to dist.
      verify-command: |
        just check
        rustup target add --toolchain "$(rustc --version --verbose | sed -n 's/^release: //p')" \
          x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
        just check-cross
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
