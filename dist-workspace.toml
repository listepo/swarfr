[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# Homebrew builds Formula/swarfr.rb as a Release asset only. Do NOT add
# publish-jobs = ["homebrew"]: that job needs HOMEBREW_TAP_TOKEN and pushes straight to
# listepo/homebrew-tap. Pulling the asset into the tap is R7 — see docs/release.md.
installers = ["shell", "homebrew"]
tap = "listepo/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
# Apple Silicon + Linux + Windows, the same three as rtok. Intel macOS is left out: its
# runners are scarce and would set the release wall-clock.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Sign macOS binaries with the Developer ID in MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD.
# dist expects CODESIGN_*; `just dist-generate` patches the generated workflow to the MACOS_*
# names, and .github/build-setup.yml discovers CODESIGN_IDENTITY.
macos-sign = true
# release.yml is post-patched to MACOS_* secrets; see scripts/dist-generate.sh
allow-dirty = ["ci"]
# Injected into build-local-artifacts after checkout: cargo cache, codesign identity on macOS.
github-build-setup = "../build-setup.yml"
# Start a release from the Actions tab. dist creates the tag itself, so `bump.yml` only has to
# land the version commit; a tag push still triggers the workflow for anyone releasing by hand.
dispatch-releases = true
# Ship `swarfr-update` beside `swarfr` so an installed binary can update itself.
install-updater = true
# The test gate is NOT a dist `plan-jobs` entry. dist's `host` job runs on
# `build-local-artifacts.result == 'skipped'`, and a failed custom job skips it — so a red gate
# would publish a Release with no binaries instead of stopping. The gate lives in the two
# workflows that dispatch this one (`bump.yml`, `release-plz.yml`), before any tag exists.
